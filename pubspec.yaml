name: erkatoy_afex_ai
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #firebase
  firebase_core: ^3.2.0
  firebase_storage: ^12.1.1
  firebase_messaging: ^15.0.3

  #network
  dio: ^5.4.1
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1

  #state management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  rxdart: ^0.27.7

  #hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.8.3

  #di
  get_it: ^7.7.0

  #audio
  just_audio: ^0.9.39
  flutter_sound: any

  #system
  go_router: ^14.1.0
  permission_handler: ^11.3.0
  flutter_markdown: ^0.7.3
  fluttertoast: ^8.2.8
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  #ui
  lottie: ^3.1.0
  google_fonts: 6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.11

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/
    - assets/lottie/sad_smiley_lottie.json
    - assets/lottie/recording_wave_animaton.json
    - assets/lottie/wave_anim.json

  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins-ThinItalic.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
          style: italic
